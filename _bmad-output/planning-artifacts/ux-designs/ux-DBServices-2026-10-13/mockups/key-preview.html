<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>預覽</title>
<style>
/* Governs: DESIGN.md preview-well, secondary-button. EXPERIENCE.md 預覽 page,
   State Patterns 沒有快照 / 沒有符合的列, UJ-3 steps 4–5. Spine wins on conflict. */
:root {
  --surface-base: #F3F5F7;
  --surface-raised: #FFFFFF;
  --surface-sunken: #E7ECF1;
  --ink-primary: #1B2430;
  --ink-secondary: #4E5D6C;
  --border: #D0D7DE;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #D5DDE3;
  font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  color: var(--ink-primary);
  font-size: 14px;
  line-height: 1.5;
}
.board { width: 1280px; margin: 24px auto; display: flex; gap: 24px; }
.frame { width: 628px; height: 800px; background: var(--surface-base); display: flex; border: 1px solid var(--border); }
.rail { width: 200px; padding: 24px 12px; border-right: 1px solid var(--border); }
.rail h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
.group { font-size: 12px; color: var(--ink-secondary); margin: 16px 0 8px; }
.nav { display: block; padding: 8px 12px; border-radius: 4px; color: var(--ink-primary); text-decoration: none; }
.nav.on { background: var(--surface-raised); border: 1px solid var(--border); }
.page { flex: 1; padding: 24px; }
.page h2 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
.tools { display: flex; gap: 8px; margin-bottom: 16px; }
button {
  background: var(--surface-raised);
  color: var(--ink-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font: inherit;
}
button:disabled { color: #8B98A5; }
.well {
  border-radius: 4px;
  padding: 24px;
  min-height: 420px;
}
.well.empty { background: var(--surface-sunken); color: var(--ink-secondary); }
.well.filled { background: var(--surface-raised); border: 1px solid var(--border); }
.block { border-top: 1px solid var(--border); padding: 12px 0; }
.block:first-child { border-top: 0; }
.meta { font-size: 12px; color: var(--ink-secondary); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--border); font-weight: 400; }
code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="board">
  <div class="frame">
    <aside class="rail">
      <h1>報表工作台</h1>
      <div class="group">終端使用者</div>
      <a class="nav" href="#talk">交談套版</a>
      <a class="nav" href="#saved">常用清單</a>
      <a class="nav on" href="#preview">預覽</a>
    </aside>
    <section class="page">
      <h2>預覽</h2>
      <div class="tools">
        <button type="button" disabled>匯出 PDF</button>
        <button type="button" disabled>列印</button>
        <button type="button" disabled>匯出 CSV</button>
      </div>
      <div class="well empty">確認之前，這裡沒有業務列。</div>
    </section>
  </div>
  <div class="frame">
    <aside class="rail">
      <h1>報表工作台</h1>
      <div class="group">終端使用者</div>
      <a class="nav" href="#talk">交談套版</a>
      <a class="nav" href="#saved">常用清單</a>
      <a class="nav on" href="#preview">預覽</a>
    </aside>
    <section class="page">
      <h2>預覽</h2>
      <div class="tools">
        <button type="button">匯出 PDF</button>
        <button type="button">列印</button>
        <button type="button">匯出 CSV</button>
      </div>
      <div class="well filled">
        <div class="block"><div class="meta">標題</div>銷貨月報</div>
        <div class="block"><div class="meta">參數 · 年月</div>2026-10</div>
        <div class="block">
          <div class="meta">資料表 · <code>query</code> · sales</div>
          <table>
            <thead><tr><th>年月</th></tr></thead>
            <tbody><tr><td>2026-10</td></tr></tbody>
          </table>
        </div>
        <div class="block"><div class="meta">計數 · <code>count</code></div>該次呼叫的計數</div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
