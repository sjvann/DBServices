<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>樣式編輯</title>
<style>
/* Governs: DESIGN.md style-block, secondary-button, commit-button.
   EXPERIENCE.md 樣式編輯, UJ-2. Order only. No business rows. Spine wins on conflict. */
:root {
  --surface-base: #F3F5F7;
  --surface-raised: #FFFFFF;
  --ink-primary: #1B2430;
  --ink-secondary: #4E5D6C;
  --border: #D0D7DE;
  --action: #0F4C5C;
  --action-foreground: #FFFFFF;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #D5DDE3;
  font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  color: var(--ink-primary);
  font-size: 14px;
  line-height: 1.5;
}
.frame { width: 1100px; height: 800px; margin: 24px auto; background: var(--surface-base); display: flex; border: 1px solid var(--border); }
.list { width: 240px; padding: 24px 16px; border-right: 1px solid var(--border); }
.list h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
.station { font-size: 12px; color: var(--ink-secondary); margin-bottom: 24px; }
.page { flex: 1; padding: 24px; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.page h2 { font-size: 20px; font-weight: 600; margin: 0; }
.commit { background: var(--action); color: var(--action-foreground); border: 0; border-radius: 4px; padding: 8px 12px; font: inherit; }
.secondary { background: var(--surface-raised); color: var(--ink-primary); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; font: inherit; }
.meta { color: var(--ink-secondary); font-size: 12px; margin: 8px 0 24px; }
.block { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.kind { font-size: 12px; color: var(--ink-secondary); }
.code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="frame">
  <aside class="list">
    <h1>樣式範本</h1>
    <p class="station">AI 報表設計工具</p>
  </aside>
  <main class="page">
    <div class="head">
      <h2>銷貨月報</h2>
      <button class="commit" type="button">儲存樣式</button>
    </div>
    <p class="meta">引用銷貨月檢視。共享。這裡沒有業務列。</p>
    <article class="block"><span>銷貨月報</span><span class="kind">標題</span></article>
    <article class="block"><span>依年月看銷貨</span><span class="kind">文字</span></article>
    <article class="block"><span>年月</span><span class="kind">參數 <span class="code">yearMonth</span></span></article>
    <article class="block">
      <span class="code">yearMonth、sku、qty</span>
      <span>
        <button class="secondary" type="button">上移</button>
        <button class="secondary" type="button">下移</button>
        <span class="kind">資料表</span>
      </span>
    </article>
  </main>
</div>
</body>
</html>
