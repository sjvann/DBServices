<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>活資料預覽</title>
<style>
/* Governs: DESIGN.md Layout & Spacing, Components (connection-row, call-list, confirm-button, trace-row).
   EXPERIENCE.md IA 活資料預覽, UJ-1 steps 1–3. Spine wins on conflict. */
:root {
  --surface-base: #F3F5F7;
  --surface-raised: #FFFFFF;
  --ink-primary: #1B2430;
  --ink-secondary: #4E5D6C;
  --border: #D0D7DE;
  --action: #0F4C5C;
  --action-fg: #FFFFFF;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #D5DDE3;
  font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
  color: var(--ink-primary);
  font-size: 14px;
  line-height: 1.5;
}
.frame { width: 1280px; height: 800px; margin: 24px auto; background: var(--surface-base); display: flex; border: 1px solid var(--border); }
.rail { width: 240px; padding: 24px 16px; border-right: 1px solid var(--border); }
.rail h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
.group { font-size: 12px; color: var(--ink-secondary); margin: 16px 0 8px; }
.nav { display: block; padding: 8px 12px; border-radius: 4px; color: var(--ink-primary); text-decoration: none; }
.nav.on { background: var(--surface-raised); border: 1px solid var(--border); }
main { flex: 1; display: flex; min-width: 0; }
.work { flex: 1; padding: 24px; min-width: 0; }
.work h2 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
.row, .call, .trace-item {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 8px;
}
.row strong { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; font-weight: 400; }
.meta { color: var(--ink-secondary); font-size: 12px; }
label { display: block; margin: 16px 0 8px; }
select, input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  font: inherit;
  background: var(--surface-raised);
}
.actions { margin-top: 16px; display: flex; gap: 8px; }
button.confirm {
  background: var(--action);
  color: var(--action-fg);
  border: 0;
  border-radius: 4px;
  padding: 8px 16px;
  font: inherit;
}
button.secondary {
  background: var(--surface-raised);
  color: var(--ink-primary);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 16px;
  font: inherit;
}
.trace { width: 280px; border-left: 1px solid var(--border); padding: 24px 16px; }
.trace h3 { font-size: 12px; font-weight: 400; color: var(--ink-secondary); margin: 0 0 12px; }
code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
</style>
</head>
<body>
<div class="frame">
  <aside class="rail">
    <h1>報表工作台</h1>
    <div class="group">規劃設計師</div>
    <a class="nav on" href="#live">活資料預覽</a>
    <a class="nav" href="#preview">預覽</a>
  </aside>
  <main>
    <section class="work">
      <h2>活資料預覽</h2>
      <p class="meta">取數表面</p>
      <div class="row">mcp</div>
      <p class="meta">具名連線</p>
      <div class="row"><strong>inventory</strong> · SqlServer</div>
      <div class="row"><strong>inventory_pg</strong> · PostgreSQL</div>
      <label for="table">資料表</label>
      <select id="table"><option>products</option></select>
      <label for="filter">等值篩選</label>
      <input id="filter" value="">
      <div class="call"><code>query</code> · inventory · products</div>
      <div class="actions">
        <button class="confirm" type="button">查詢</button>
        <button class="secondary" type="button">計數</button>
      </div>
    </section>
    <aside class="trace">
      <h3>取數軌跡</h3>
      <div class="trace-item"><code>fields</code><div class="meta">inventory · products</div></div>
      <div class="trace-item"><code>tables</code><div class="meta">inventory</div></div>
    </aside>
  </main>
</div>
</body>
</html>
