name: Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "DBService/**"
      - "DbServices.Core/**"
      - "DbServices.Provider.*/**"
      - "DbServices.Api.Shared/**"
      - "DbServices.Mcp/**"
      - "McpService/**"
      - "GraphQLService/**"
      - "Directory.Build.props"
      - ".github/workflows/docs.yml"
      - ".config/dotnet-tools.json"
  pull_request:
    paths:
      - "docs/**"
      - "DBService/**"
      - "DbServices.Core/**"
      - "DbServices.Provider.*/**"
      - "DbServices.Api.Shared/**"
      - "DbServices.Mcp/**"
      - "McpService/**"
      - "GraphQLService/**"
      - "Directory.Build.props"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "發行版次，寫入站台頁尾"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore DBServices.sln

      - name: Stamp docs version
        if: inputs.version != ''
        env:
          DOCS_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os

          path = "docs/docfx.json"
          version = os.environ["DOCS_VERSION"]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          footer = f"<span>DBServices {version} · Copyright © 2026 sjvann · MIT License</span>"
          data["build"]["globalMetadata"]["_appFooter"] = footer
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"Stamped docs version {version}")
          PY

      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json

      - name: Add .nojekyll
        run: touch docs/_site/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
